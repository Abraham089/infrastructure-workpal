apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: workpal
  name: frontend-workpal
spec:
  selector:
    matchLabels:
      app: frontend-workpal
  template:
    metadata:
      labels:
        app: frontend-workpal
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend-workpal
          image: ghcr.io/vicentt16/workpalfrontend:dev-latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
              ephemeral-storage: "256Mi"
            limits:
              memory: "256Mi"
              cpu: "500m"
              ephemeral-storage: "512Mi"
          ports:
            - containerPort: 5173
          env:
            - name: API_URL
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: API_URL
---
apiVersion: v1
kind: Secret
metadata:
  namespace: workpal
  name: frontend-secret
type: Opaque
stringData:
  API_URL: http://localhost:8000/v1
---
apiVersion: v1
kind: Service
metadata:
  namespace: workpal
  name: frontend-service
spec:
  selector:
    app: frontend-workpal
  ports:
    - protocol: TCP
      port: 5173
      targetPort: 5173
